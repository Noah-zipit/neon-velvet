<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0618" />
    <title>NEON VELVET</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #0a0618;
        touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none;
        font-family: "Courier New", monospace;
      }
      #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0a0618; }
      #game { image-rendering: pixelated; image-rendering: crisp-edges; background: #0a0618; touch-action: none; }
      #touch {
        position: fixed; inset: 0; pointer-events: none; display: none; z-index: 10;
      }
      #touch.on { display: block; }
      .tbtn {
        position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); pointer-events: auto;
        width: 76px; height: 76px; border-radius: 50%;
        background: rgba(255, 42, 130, 0.18); border: 2px solid rgba(255, 42, 130, 0.55);
        color: #ffd7ec; font-size: 30px; display: flex; align-items: center; justify-content: center;
        font-family: "Courier New", monospace; font-weight: bold;
      }
      .tbtn:active { background: rgba(255, 42, 130, 0.45); }
      #btnL { left: 18px; } #btnR { left: 112px; }
      #btnJ { right: 18px; width: 92px; height: 92px; border-color: rgba(0, 229, 255, 0.55); background: rgba(0, 229, 255, 0.14); }
      #btnJ:active { background: rgba(0, 229, 255, 0.4); }
      #btnP {
        position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; pointer-events: auto;
        width: 44px; height: 44px; border-radius: 10px; font-size: 20px;
        background: rgba(20, 12, 40, 0.6); border: 2px solid rgba(0, 229, 255, 0.4); color: #bff3ff;
        display: flex; align-items: center; justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="game" width="480" height="270"></canvas></div>
    <div id="touch">
      <div class="tbtn" id="btnL">&#9664;</div>
      <div class="tbtn" id="btnR">&#9654;</div>
      <div class="tbtn" id="btnJ">&#8593;</div>
      <div class="tbtn" id="btnP">| |</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
